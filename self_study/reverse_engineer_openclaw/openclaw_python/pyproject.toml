[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-python"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2",
    "structlog>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[tool.pytest.int_options]
testpaths = ["tests"]
pythonpath = ["."]